name: TaskTracker
options:
  bundleIdPrefix: com.tasktracker
  deploymentTarget:
    iOS: "17.0"
packages:
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    from: 9.2.0
targets:
  TaskTracker:
    type: application
    platform: iOS
    sources:
      - TaskTracker
    dependencies:
      - package: GoogleSignIn
        product: GoogleSignIn
      - package: GoogleSignIn
        product: GoogleSignInSwift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tasktracker.app
        INFOPLIST_FILE: TaskTracker/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: 5.10
        DEVELOPMENT_TEAM: ""
    info:
      path: TaskTracker/Info.plist
      properties:
        CFBundleDisplayName: Task Tracker
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              - REPLACE_WITH_REVERSED_IOS_CLIENT_ID
        GIDClientID: REPLACE_WITH_IOS_CLIENT_ID.apps.googleusercontent.com
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
